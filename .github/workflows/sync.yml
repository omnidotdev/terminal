name: Sync

on:
  pull_request:
    branches:
      - master

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate version sync
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Sync version
        run: bun scripts/syncVersion.ts

      # Formatting, clippy and tests run in test.yml; this job only guards that
      # Cargo.toml stays in sync with package.json, so it needs no Rust toolchain
      - name: Check version sync
        run: |
          if ! git diff --exit-code Cargo.toml; then
            echo "Error: Cargo.toml version is out of sync with package.json"
            echo "Run 'bun scripts/syncVersion.ts' to fix"
            exit 1
          fi
